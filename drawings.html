<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marylou drawings</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden; 
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .gallery-side {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .grid-item {
            border: 2px solid black;
            cursor: pointer;
            aspect-ratio: 1 / 1; 
            overflow: hidden;    
        }

        .grid-item.active {
            border: 4px dashed red; 
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;   
        }

        .preview-side {
            width: 50vw;
            border-left: 2px solid black;
            padding: 15px;
            overflow-y: auto;
        }

        .preview-box {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
        }

        .preview-info {
            order: 1;
            margin-bottom: 10px;
        }

        .preview-img-container {
            order: 2;
            width: 100%;
            border: 2px solid black;
        }

        .preview-img-container img {
            width: 100%;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                height: 100vh;
            }

            .gallery-side {
                height: 75vh;
                flex: none;
                overflow-y: auto;
            }

            .preview-side {
                width: 100%;
                height: 25vh;
                position: fixed;
                bottom: 0;
                left: 0;
                z-index: 10;
                background: white;
                border-left: none;
                border-top: 2px solid black; 
                padding: 10px;
                overflow-y: auto;
            }

            .preview-box {
                flex-direction: row;
                gap: 10px;
            }

            .preview-info {
                order: unset;
                margin-bottom: 0;
                flex: 1;
            }

            .preview-img-container {
                order: unset;
                width: auto;
                height: calc(25vh - 20px); 
                aspect-ratio: 1 / 1;
            }

            .preview-img-container img {
                height: 100%;
                object-fit: cover;
            }
        }
    </style>
</head>

                    <img id="main-preview" src="" alt="preview">
                </div>

        <script>
        const gridContainer = document.getElementById('grid-container');
        const items = document.querySelectorAll('.grid-item');
        const pImgBox = document.getElementById('preview-img-box');
        const pImg = document.getElementById('main-preview');
        const pTitle = document.getElementById('preview-title');
        const pTextContainer = document.getElementById('preview-text-container');

        let clickedItem = null;

        function renderDetails(target) {
            pImgBox.classList.remove('hidden');
            
            const oldDesc = document.getElementById('preview-desc');
            const newLink = document.createElement('a');
            newLink.id = 'preview-desc';
            newLink.href = target.getAttribute('data-url');
            newLink.target = '_blank';
            newLink.textContent = target.getAttribute('data-desc');
            
            pTextContainer.replaceChild(newLink, oldDesc);

            pImg.src = target.querySelector('img').src;
            pTitle.textContent = target.getAttribute('data-title');
            pTitle.style.color = '#000000'; 
        }

        function renderDefaultState() {
            pImgBox.classList.add('hidden');
            
            const oldDesc = document.getElementById('preview-desc');
            const newPara = document.createElement('p');
            newPara.id = 'preview-desc';
            newPara.textContent = 'Hover or click an image to view details.';
            
            pTextContainer.replaceChild(newPara, oldDesc);

            pImg.src = "";
            pTitle.innerHTML = '<span style="color: red;">No </span><span style="color: blue;">selection made</span>';
            pTitle.style.color = ''; 
        }

        const isMobile = window.matchMedia("(max-width: 600px)");

        items.forEach(item => {
            item.addEventListener('mouseenter', () => {
                if (!isMobile.matches) {
                    renderDetails(item);
                }
            });

            item.addEventListener('click', () => {
                items.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                clickedItem = item; 
                renderDetails(item);
            });
        });

        gridContainer.addEventListener('mouseleave', () => {
            if (!isMobile.matches) {
                if (clickedItem) {
                    renderDetails(clickedItem);
                } else {
                    renderDefaultState();
                }
            }
        });
    </script>
