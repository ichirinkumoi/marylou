<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .gallery-side {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .grid-item {
            border: 1px solid black;
            cursor: pointer;
            aspect-ratio: 1 / 1; 
            overflow: hidden;    
        }

        .grid-item.active {
            border: 4px dashed red; 
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;   
        }

        .preview-side {
            width: 50vw;
            border-left: 1px solid black;
            padding: 15px;
            overflow-y: auto;
        }

        .preview-box {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
        }

        .preview-info {
            order: 1;
            margin-bottom: 10px;
        }

        .preview-img-container {
            order: 2;
            width: 100%;
            border: 1px solid black;
        }

        .preview-img-container img {
            width: 100%;
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                height: 100vh;
            }

            .gallery-side {
                height: 75vh;
                flex: none;
                overflow-y: auto;
            }

            .preview-side {
                width: 100%;
                height: 25vh;
                position: fixed;
                bottom: 0;
                left: 0;
                z-index: 10;
                background: white;
                border-left: none;
                border-top: 2px solid black;
                padding: 10px;
                overflow-y: auto;
            }

            .preview-box {
                flex-direction: row;
                gap: 10px;
            }

            .preview-info {
                order: unset;
                margin-bottom: 0;
                flex: 1;
            }

            .preview-img-container {
                order: unset;
                width: auto;
                height: calc(25vh - 20px);
                aspect-ratio: 1 / 1;
            }

            .preview-img-container img {
                height: 100%;
                object-fit: cover;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <main class="gallery-side">
            <div class="image-grid" id="grid-container">
                <div class="grid-item active" data-title="17 october 2026" data-desc="direct link" data-url="media/9h5rw4.png">
                    <img src="media/9h5rw4.png" alt="17 october 2026">
                </div>
                <div class="grid-item" data-title="01 october 2026" data-desc="direct link" data-url="media/galacticnova23.png">
                    <img src="media/galacticnova23.png" alt="01 october 2026">
                </div>
                <div class="grid-item" data-title="29 september 2026" data-desc="direct link" data-url="media/nograce2.png">
                    <img src="media/nograce2.png" alt="29 september 2026">
                </div>
				<div class="grid-item" data-title="25 september 2026" data-desc="direct link" data-url="media/riakatrh30.png">
                    <img src="media/riakatrh30.png" alt="25 september 2026">
                </div>
				<div class="grid-item" data-title="20 september 2026" data-desc="direct link" data-url="media/yeahcoolfinal.png">
                    <img src="media/yeahcoolfinal.png" alt="20 september 2026">
                </div>
				<div class="grid-item" data-title="date" data-desc="direct link" data-url="link">
                    <img src="link" alt="date">
                </div>
				<div class="grid-item" data-title="date" data-desc="direct link" data-url="link">
                    <img src="link" alt="date">
                </div>
				<div class="grid-item" data-title="date" data-desc="direct link" data-url="link">
                    <img src="link" alt="date">
                </div>
				<div class="grid-item" data-title="date" data-desc="direct link" data-url="link">
                    <img src="link" alt="date">
                </div>
				<div class="grid-item" data-title="date" data-desc="direct link" data-url="link">
                    <img src="link" alt="date">
                </div>
				<div class="grid-item" data-title="date" data-desc="direct link" data-url="link">
                    <img src="link" alt="date">
                </div>
				<div class="grid-item" data-title="date" data-desc="direct link" data-url="link">
                    <img src="link" alt="date">
                </div>
				<div class="grid-item" data-title="date" data-desc="direct link" data-url="link">
                    <img src="link" alt="date">
                </div>
            </div>
        </main>

        <aside class="preview-side">
            <div class="preview-box">
                <div class="preview-info">
                    <h3 id="preview-title">Google</h3>
                    <a id="preview-desc" href="https://google.com" target="_blank">Click here to visit Google</a>
                </div>
                <div class="preview-img-container">
                    <img id="main-preview" src="https://picsum.photos" alt="Preview">
                </div>
            </div>
        </aside>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        const items = document.querySelectorAll('.grid-item');
        const pImg = document.getElementById('main-preview');
        const pTitle = document.getElementById('preview-title');
        const pDesc = document.getElementById('preview-desc');

        let clickedItem = items[0];

        function renderDetails(target) {
            pImg.src = target.querySelector('img').src;
            pTitle.textContent = target.getAttribute('data-title');
            pDesc.textContent = target.getAttribute('data-desc');
            pDesc.href = target.getAttribute('data-url');
        }

        items.forEach(item => {
            item.addEventListener('mouseenter', () => {
                renderDetails(item);
            });

            item.addEventListener('click', () => {
                items.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                clickedItem = item;
                renderDetails(item);
            });
        });

        gridContainer.addEventListener('mouseleave', () => {
            if (clickedItem) {
                renderDetails(clickedItem);
            }
        });
    </script>
</body>
</html>
